name: Build

permissions:
  contents: write

on:
  push:
    branches:
      - "main"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: macos-latest

    steps:
      - name: Xcode Setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Procursus
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Install GNU Make
        run: |
          brew install make
          echo "PATH=$(brew --prefix make)/libexec/gnubin:$PATH" >> "$GITHUB_ENV"

      - name: Install Theos
        run: |
          set -eux

          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

          mkdir -p "$THEOS"

          curl -fsSL \
            https://raw.githubusercontent.com/theos/theos/master/bin/install-theos \
            -o install-theos.sh

          # Prevent the Theos installer from attempting to download
          # SDKs through the GitHub API. We install the SDK manually below.
          gsed -E \
            "/^\s*get_theos\s*$/,+1 s/^(\s*)(get_sdks)\s*$/\1mkdir -p \${THEOS}\/sdks\n\1touch \${THEOS}\/sdks\/sdk\n\1\2/g" \
            -i install-theos.sh

          bash install-theos.sh

      - name: Install iPhoneOS 16.5 SDK
        run: |
          set -eux

          export THEOS="$GITHUB_WORKSPACE/theos"

          mkdir -p "$THEOS/sdks"

          curl -L \
            https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz \
            -o /tmp/iPhoneOS16.5.sdk.tar.xz

          tar -xJf \
            /tmp/iPhoneOS16.5.sdk.tar.xz \
            -C "$THEOS/sdks"

          rm -f /tmp/iPhoneOS16.5.sdk.tar.xz

          echo "Installed SDKs:"
          ls -la "$THEOS/sdks"

      - name: Verify SDK
        run: |
          set -eux

          export THEOS="$GITHUB_WORKSPACE/theos"

          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"

          echo "Checking for fileport.h..."
          find "$THEOS/sdks/iPhoneOS16.5.sdk" \
            -name "fileport.h" \
            -print

          echo "Checking Theos toolchain..."
          find "$THEOS/toolchain" -maxdepth 3 -type f -name clang -print

      - name: Build
        run: |
          set -eux

          export THEOS="$GITHUB_WORKSPACE/theos"

          gmake -j"$(sysctl -n hw.logicalcpu)" \
            package \
            FINALPACKAGE=1 \
            STRIP=0

          gmake clean

          gmake -j"$(sysctl -n hw.logicalcpu)" \
            package \
            FINALPACKAGE=1 \
            STRIP=0 \
            TROLLSTORE=1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeodeLauncher
          path: packages/*.*

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Declare Version Variables
        id: ref
        run: |
          echo "version=$(cat VERSION | xargs)" >> "$GITHUB_OUTPUT"
          echo "hash=$(git rev-parse --short "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: "${{ github.workspace }}/artifacts"

      - name: Rename files
        run: |
          mv \
            "artifacts/GeodeLauncher/be.dimisaio.dindem_${{ steps.ref.outputs.version }}.ipa" \
            "artifacts/GeodeLauncher/be.dimisaio.dindem_${{ steps.ref.outputs.hash }}.ipa"

          mv \
            "artifacts/GeodeLauncher/be.dimisaio.dindem_${{ steps.ref.outputs.version }}.tipa" \
            "artifacts/GeodeLauncher/be.dimisaio.dindem_${{ steps.ref.outputs.hash }}.tipa"

      - name: Update Development Release
        uses: andelf/nightly-release@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly
          name: Development Release
          body: |
            Geode iOS development release for commit ${{ github.sha }}.
            This is meant for developers.
            Please look below this release for the latest stable release.
          files: |
            ./artifacts/GeodeLauncher/*.ipa
            ./artifacts/GeodeLauncher/*.tipa
